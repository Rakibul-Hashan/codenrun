<script>
// Pick the theme before first paint: saved choice, else the viewer's theme, else the OS setting.
(function () {
  var ui = null;
  try { ui = JSON.parse(localStorage.getItem('cplay.ui')); } catch (e) {}
  if (ui !== 'sea' && ui !== 'sketch') {
    var t = document.documentElement.getAttribute('data-theme');
    ui = t === 'light' ? 'sketch' : t === 'dark' ? 'sea' : (matchMedia('(prefers-color-scheme: light)').matches ? 'sketch' : 'sea');
  }
  document.documentElement.setAttribute('data-ui', ui);
})();
</script>

<style>
/*
VOICE: a working tool. Dark "deep sea" for long sessions; light is a playful sketchbook.
IDEA: source on the left, what the machine did on the right, like facing pages of a notebook.
PICTURE: the editor and live terminal themselves, filling the screen under a slim bar.
COLOUR and TYPE: sea #0a2540 / sky / signal pink; sketchbook: dotted paper, ink #1f2a44, marker pink, highlighter yellow; Hanken Grotesk or Patrick Hand + Caveat, JetBrains Mono for code.
LAYOUT: bar, two panes with a draggable divider; stacks editor over output below 760px.
*/
:root{color-scheme:dark;
  --bg:#0a2540;--panel:#0c2d4d;--edit:#081d33;--line:#16406a;--ink:#eaf4ff;--mute:#8fb0cf;--sky:#8fd3ff;--pink:#ff5c8a;--ok:#7be0a8;--warn:#ffd27a;
  --term:#061a2e;--termInk:#e6f1fc;--err:#ff8fae;--on-pink:#fff;
  --ui:'Hanken Grotesk',system-ui,sans-serif;--head:'Hanken Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --fs:14px;--r:8px;--bw:1px;--shadow:none;--paneGap:0px}
:root[data-ui=sketch]{color-scheme:light;
  --bg:#fbfaf6;--panel:#ffffff;--edit:#fffefb;--line:#1f2a44;--ink:#1f2a44;--mute:#5b6683;--sky:#1f6fd1;--pink:#ff4f7e;--ok:#17834b;--warn:#b86e00;
  --term:#fffbe6;--termInk:#1f2a44;--err:#d61f55;--on-pink:#fff;
  --ui:'Patrick Hand','Comic Sans MS',system-ui,sans-serif;--head:'Caveat','Patrick Hand',cursive;
  --r:255px 14px 225px 14px/14px 225px 14px 255px;--bw:2px;--shadow:3px 3px 0 #1f2a44;--paneGap:14px}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);overflow:hidden;display:flex;flex-direction:column}
[data-ui=sketch] body{font-size:17px;background-image:radial-gradient(#cdd3e2 1.1px,transparent 1.3px);background-size:20px 20px}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.ic{width:17px;height:17px;flex:none;display:inline-block;vertical-align:middle}
.ic svg{width:100%;height:100%;display:block}
[data-ui=sketch] .ic svg{stroke-width:2.25}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;padding:10px max(16px,2vw);border-bottom:1px solid var(--line);flex-wrap:wrap}
[data-ui=sketch] .bar{border-bottom:0;padding-bottom:4px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.brand h1{margin:0;line-height:0}
.brand-logo{display:block;width:158px;height:auto;filter:brightness(0) invert(1)}
[data-ui=sketch] .brand-logo{filter:none}
.brand small{display:block;color:var(--mute);font-size:13px}
[data-ui=sketch] .brand small{font-size:15px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn,.sel{height:40px;border:var(--bw) solid var(--line);background:var(--panel);border-radius:var(--r);padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:14px;white-space:nowrap;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
[data-ui=sketch] .btn,[data-ui=sketch] .sel{font-size:17px}
.btn:hover,.sel:hover{border-color:#2b6aa3}
[data-ui=sketch] .btn:hover,[data-ui=sketch] .sel:hover{border-color:var(--ink);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
[data-ui=sketch] .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.sel{appearance:none;padding-right:32px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.run{background:var(--pink);border-color:var(--pink);color:var(--on-pink);font-weight:600;padding:0 18px;min-width:104px;justify-content:center}
[data-ui=sketch] .run{border-color:var(--ink);font-weight:400;transform:rotate(-1deg)}
.run:hover{filter:brightness(1.06)}
.run.stop{background:#fff;color:#0a2540;border-color:#fff}
[data-ui=sketch] .run.stop{background:#ffe066;color:var(--ink);border-color:var(--ink)}
.icon-only{width:40px;padding:0;justify-content:center}

/* language switch */
.seg{display:inline-flex;height:40px;border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:0 14px;cursor:pointer;font-family:var(--mono);font-weight:700;font-size:14px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--sky);color:#06223d}
[data-ui=sketch] .seg button[aria-pressed=true]{background:#ffe066;color:var(--ink)}
.seg button+button{border-left:var(--bw) solid var(--line)}

.opts{position:relative}
.opts summary{list-style:none}
.opts summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:48px;z-index:20;width:300px;background:var(--panel);border:var(--bw) solid #2b6aa3;border-radius:10px;padding:14px;display:grid;gap:12px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
[data-ui=sketch] .pop{border-color:var(--ink);border-radius:var(--r);box-shadow:5px 5px 0 var(--ink)}
.pop label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
[data-ui=sketch] .pop label{font-size:16px}
.pop .row{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.pop input[type=text]{height:40px;border-radius:8px;border:var(--bw) solid var(--line);background:var(--edit);padding:0 10px;font-family:var(--mono);font-size:14px}
.pop .sel{width:100%;background-color:var(--edit);box-shadow:none}
.pop input[type=checkbox]{width:18px;height:18px;accent-color:var(--pink)}
.fsz{display:flex;gap:6px}.fsz .btn{flex:1;justify-content:center;box-shadow:none}

/* panes */
.work{flex:1;display:grid;grid-template-columns:minmax(0,calc(var(--split,58%) - 4px)) 8px minmax(0,1fr);min-height:0}
[data-ui=sketch] .work{padding:10px max(16px,2vw) 12px;column-gap:6px;grid-template-columns:minmax(0,calc(var(--split,58%) - 10px)) 8px minmax(0,1fr)}
.pane{display:flex;flex-direction:column;min-height:0;background:var(--panel)}
[data-ui=sketch] .pane{border:2px solid var(--ink);border-radius:18px 6px 16px 8px/8px 16px 6px 18px;box-shadow:4px 5px 0 var(--ink);overflow:hidden}
.head{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);font-size:14px;color:var(--mute);flex:none}
[data-ui=sketch] .head{border-bottom:2px dashed var(--ink);font-size:17px}
.tab{color:var(--ink);font-family:var(--mono);font-size:13px;display:flex;align-items:center;gap:8px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--sky);display:inline-block}
.tab i.dirty{background:var(--warn)}
[data-ui=sketch] .tab b{font-weight:500;background:linear-gradient(transparent 55%,#ffe066 55%)}
.tab b{font-weight:500}
.head .sp{margin-left:auto}
.head .title{color:var(--ink);display:flex;align-items:center;gap:7px}
.mini{height:32px;padding:0 10px;font-size:13px;border-radius:6px;box-shadow:none}
[data-ui=sketch] .mini{border-radius:var(--r);font-size:16px;box-shadow:2px 2px 0 var(--ink)}
.mini .ic{width:15px;height:15px}
.gutter{background:var(--line);cursor:col-resize;position:relative}
[data-ui=sketch] .gutter{background:none}
[data-ui=sketch] .gutter::before{content:"";position:absolute;left:3px;top:20%;bottom:20%;border-left:2px dashed #9aa3ba}
.gutter::after{content:"";position:absolute;inset:0 -4px}
.gutter:hover,.gutter.drag{background:var(--sky)}
[data-ui=sketch] .gutter:hover::before,[data-ui=sketch] .gutter.drag::before{border-color:var(--pink)}
#ed{flex:1;min-height:0;background:var(--edit)}

/* editor: deep sea */
.CodeMirror{height:100%;font-family:var(--mono);font-size:var(--fs);line-height:1.6;background:var(--edit);color:#dce9f7}
.cm-s-cc .CodeMirror-gutters{background:var(--edit);border-right:1px solid var(--line)}
.cm-s-cc .CodeMirror-linenumber{color:#4f7398;padding:0 10px 0 6px}
.cm-s-cc .CodeMirror-cursor{border-left:2px solid var(--pink)}
.cm-s-cc .CodeMirror-activeline-background{background:rgba(143,211,255,.06)}
.cm-s-cc .CodeMirror-activeline-gutter .CodeMirror-linenumber{color:var(--sky)}
.cm-s-cc div.CodeMirror-selected,.cm-s-cc.CodeMirror-focused div.CodeMirror-selected{background:rgba(143,211,255,.22)}
.cm-s-cc .cm-keyword{color:var(--pink)}
.cm-s-cc .cm-type,.cm-s-cc .cm-variable-3{color:#c3a6ff}
.cm-s-cc .cm-meta{color:#ff9ab6}
.cm-s-cc .cm-string,.cm-s-cc .cm-string-2{color:#9be7b5}
.cm-s-cc .cm-number,.cm-s-cc .cm-atom{color:var(--warn)}
.cm-s-cc .cm-comment{color:#6a8db0;font-style:italic}
.cm-s-cc .cm-def{color:var(--sky)}
.cm-s-cc .cm-variable{color:#dce9f7}
.cm-s-cc .cm-operator{color:#a9c6e3}
.cm-s-cc .cm-builtin{color:var(--sky)}
.cm-s-cc .CodeMirror-matchingbracket{color:#fff!important;background:rgba(255,92,138,.35)}
/* editor: sketchbook (notebook margin line, ink and marker colours) */
[data-ui=sketch] .CodeMirror{color:#1f2a44}
[data-ui=sketch] .cm-s-cc .CodeMirror-gutters{border-right:2px solid #ff9db6}
[data-ui=sketch] .cm-s-cc .cm-variable{color:#1f2a44}
[data-ui=sketch] .cm-s-cc .cm-keyword{color:#d3124f}
[data-ui=sketch] .cm-s-cc .cm-type,[data-ui=sketch] .cm-s-cc .cm-variable-3{color:#6a3fd1}
[data-ui=sketch] .cm-s-cc .cm-meta{color:#b0285b}
[data-ui=sketch] .cm-s-cc .cm-string,[data-ui=sketch] .cm-s-cc .cm-string-2{color:#11804a}
[data-ui=sketch] .cm-s-cc .cm-number,[data-ui=sketch] .cm-s-cc .cm-atom{color:#a35d00}
[data-ui=sketch] .cm-s-cc .cm-comment{color:#7a8499}
[data-ui=sketch] .cm-s-cc .cm-def{color:#0f63c4}
[data-ui=sketch] .cm-s-cc .cm-operator{color:#36506b}
[data-ui=sketch] .cm-s-cc .cm-builtin{color:#0f63c4}
[data-ui=sketch] .cm-s-cc .CodeMirror-linenumber{color:#9aa3ba}
[data-ui=sketch] .cm-s-cc .CodeMirror-activeline-background{background:rgba(255,224,102,.28)}
[data-ui=sketch] .cm-s-cc .CodeMirror-activeline-gutter .CodeMirror-linenumber{color:var(--ink)}
[data-ui=sketch] .cm-s-cc div.CodeMirror-selected,[data-ui=sketch] .cm-s-cc.CodeMirror-focused div.CodeMirror-selected{background:rgba(31,111,209,.18)}
[data-ui=sketch] .cm-s-cc .CodeMirror-matchingbracket{color:var(--ink)!important;background:rgba(255,79,126,.25)}
.ln-error{background:rgba(255,92,138,.14)}.ln-warning{background:rgba(255,210,122,.12)}
.mk{width:8px;height:8px;border-radius:50%;margin:8px 0 0 3px}.mk.error{background:var(--pink)}.mk.warning{background:var(--warn)}
.CodeMirror-hints{font-family:var(--mono);font-size:13px;background:var(--panel);border:var(--bw) solid #2b6aa3;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:30}
[data-ui=sketch] .CodeMirror-hints{border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.CodeMirror-hint{color:var(--ink);padding:3px 10px}
li.CodeMirror-hint-active{background:var(--pink);color:#fff}
.CodeMirror-dialog{background:var(--panel);color:var(--ink)}.CodeMirror-dialog input{font-family:var(--mono)}

/* terminal */
.outbody{flex:1;min-height:0;position:relative;display:flex}
.term{flex:1;overflow:auto;padding:14px 16px 24px;font-family:var(--mono);font-size:var(--fs);line-height:1.55;white-space:pre;background:var(--term);color:var(--termInk);cursor:text}
[data-ui=sketch] .term{background-image:repeating-linear-gradient(transparent 0 calc(var(--fs) * 1.55 - 1px),#ece3b8 calc(var(--fs) * 1.55 - 1px) calc(var(--fs) * 1.55));background-attachment:local;background-position:0 14px}
.term .ob{display:block}
.term.wrap{white-space:pre-wrap;word-break:break-word}
.term .meta,.term .hello,.term .waiting{white-space:pre-wrap}
.term .err{color:var(--err)}.term .warn{color:var(--warn)}.term .note{color:var(--mute)}
.term .in{color:var(--sky)}
.term .meta{display:block;margin-top:14px;color:var(--mute);font-size:13px;border-top:1px dashed var(--line);padding-top:8px;font-family:var(--ui)}
[data-ui=sketch] .term .meta{font-size:16px;border-top:2px dashed #c9bf8f}
.term .meta.bad{color:var(--err)}.term .meta.good{color:var(--ok)}
.term .diag{display:block;cursor:pointer;border-radius:4px}
.term .diag:hover{background:rgba(143,211,255,.1)}
.term .hello{color:var(--mute);white-space:normal;font-family:var(--ui);font-size:15px;max-width:52ch}
[data-ui=sketch] .term .hello{font-size:18px}
.term .hello b{color:var(--ink);font-weight:600}
[data-ui=sketch] .term .hello b{font:700 26px/1.2 var(--head);display:block;margin-bottom:4px}
.term kbd,.status kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink)}
#stdin{background:transparent;border:0;outline:0;color:var(--sky);font:inherit;width:24ch;max-width:100%;caret-color:var(--pink);padding:0}
.waiting{display:flex;gap:8px;align-items:center;margin-top:10px;font-family:var(--ui);font-size:13px;color:var(--mute)}
[data-ui=sketch] .waiting{font-size:16px}
.waiting .dot{width:8px;height:8px;border-radius:50%;background:var(--pink);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.waiting .dot{animation:none}.btn{transition:none}}

/* files panel */
.files{position:absolute;inset:0;background:var(--panel);display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);z-index:5}
.flist{border-right:1px solid var(--line);overflow:auto;padding:8px}
[data-ui=sketch] .flist{border-right:2px dashed var(--ink)}
.flist button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;font-family:var(--mono);font-size:13px;color:var(--ink)}
.flist button small{color:var(--mute)}
.flist button[aria-current=true]{background:rgba(143,211,255,.16)}
[data-ui=sketch] .flist button[aria-current=true]{background:#ffe066}
.flist p{color:var(--mute);font-size:13px;padding:8px}
.fedit{display:flex;flex-direction:column;gap:8px;padding:10px;min-height:0}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fnote{font-size:13px;color:var(--mute)}
#fname{flex:1;height:32px;border-radius:6px;border:var(--bw) solid var(--line);background:var(--edit);padding:0 8px;font-family:var(--mono);font-size:14px;color:var(--ink)}
#ftext{flex:1;min-height:80px;resize:none;border-radius:6px;border:var(--bw) solid var(--line);background:var(--term);color:var(--termInk);padding:10px;font:var(--fs)/1.5 var(--mono)}
#filesBtn[aria-expanded=true]{border-color:var(--sky);color:var(--sky)}

/* status */
.status{height:32px;display:flex;align-items:center;gap:16px;padding:0 max(16px,2vw);border-top:1px solid var(--line);font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;flex:none}
[data-ui=sketch] .status{border-top:0;font-size:16px;height:30px}
.status .grow{margin-left:auto;display:flex;gap:14px;align-items:center}
.prog{width:120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
[data-ui=sketch] .prog{background:#e3e6ef;border:1px solid var(--ink);height:8px}
.prog b{display:block;height:100%;width:0;background:var(--sky);transition:width .2s}
.prog.pending b{width:35%;animation:compiler-progress 1.15s ease-in-out infinite alternate}
@keyframes compiler-progress{to{transform:translateX(185%)}}
@media (prefers-reduced-motion:reduce){.prog.pending b{animation:none}}
.pill{display:inline-flex;align-items:center;gap:6px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--warn)}
.pill.ready i{background:var(--ok)}.pill.bad i{background:var(--pink)}
.toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:#fff;color:#0a2540;padding:8px 14px;border-radius:8px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
[data-ui=sketch] .toast{background:#ffe066;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:17px;font-weight:400}
.toast.on{opacity:1}
.keys{position:fixed;inset:0;z-index:50;background:rgba(3,14,26,.6);display:grid;place-items:center;padding:16px}
[data-ui=sketch] .keys{background:rgba(251,250,246,.75)}
.keysCard{background:var(--panel);border:var(--bw) solid #2b6aa3;border-radius:12px;width:min(820px,100%);max-height:90vh;overflow:auto;padding:18px 20px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
[data-ui=sketch] .keysCard{border:2px solid var(--ink);border-radius:var(--r);box-shadow:6px 6px 0 var(--ink)}
.keysHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.keysHead h2{margin:0;font:600 20px/1.2 var(--head)}
[data-ui=sketch] .keysHead h2{font-size:32px;font-weight:700}
.keysGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:6px 28px}
.keysGrid h3{grid-column:1/-1;margin:12px 0 2px;font:600 13px/1.3 var(--ui);color:var(--sky)}
[data-ui=sketch] .keysGrid h3{font-size:18px;color:var(--pink)}
.krow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);font-size:14px}
[data-ui=sketch] .krow{font-size:17px;border-bottom-color:#c5cad8}
.krow span:last-child{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.krow kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap;color:var(--ink)}
.keysNote{color:var(--mute);font-size:13px;margin:14px 0 0}
.cm-matchhighlight{background:rgba(143,211,255,.16);border-radius:2px}
[data-ui=sketch] .cm-matchhighlight{background:rgba(255,224,102,.55)}
.CodeMirror-selection-highlight-scrollbar{background:var(--sky)}
.edbody{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
button.tab{background:none;border:0;padding:4px 6px;margin-left:-6px;border-radius:6px;cursor:pointer;max-width:55%}
button.tab:hover,button.tab[aria-expanded=true]{background:rgba(143,211,255,.12)}
[data-ui=sketch] button.tab:hover,[data-ui=sketch] button.tab[aria-expanded=true]{background:#ffe066}
button.tab b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progs{position:absolute;inset:0;z-index:6;background:var(--panel);display:flex;flex-direction:column}
.prow{display:flex;gap:8px;align-items:center;padding:10px 12px}
.prow .sp{margin-left:auto}
.pfoot{border-top:1px solid var(--line);flex-wrap:wrap}
[data-ui=sketch] .pfoot{border-top:2px dashed var(--ink)}
#progSearch{flex:1;height:34px;border-radius:6px;border:var(--bw) solid var(--line);background:var(--edit);padding:0 10px;font-size:14px;color:var(--ink)}
.plist{flex:1;overflow:auto;padding:0 8px 8px}
.pitem{display:flex;align-items:center;gap:4px;border-radius:8px;padding:2px 4px}
.pitem:hover,.pitem:focus-within{background:rgba(143,211,255,.08)}
.pitem[aria-current=true]{background:rgba(143,211,255,.16)}
[data-ui=sketch] .pitem[aria-current=true]{background:#fff3b0}
.popen{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:none;border:0;padding:8px;cursor:pointer;text-align:left;min-width:0}
.pname{font-family:var(--mono);font-size:14px;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmeta{font-size:12px;color:var(--mute)}
[data-ui=sketch] .pmeta{font-size:15px}
.pact{display:flex;gap:2px}
.pact button{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--mute)}
.pact button:hover{color:var(--ink);background:rgba(143,211,255,.14)}
.pact button.confirm{width:auto;padding:0 10px;color:#fff;background:var(--pink);font-size:13px}
.pact .ic{width:16px;height:16px}
.prename{flex:1;height:34px;margin:6px 4px;border-radius:6px;border:var(--bw) solid var(--sky);background:var(--edit);padding:0 8px;font-family:var(--mono);font-size:14px;color:var(--ink)}
.plist .empty{color:var(--mute);padding:16px 8px;font-size:14px}
.shotCard{width:min(1040px,100%)}
.shotOpts{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin:4px 0 12px}
.shotOpts label{display:grid;gap:4px;font-size:13px;color:var(--mute)}
[data-ui=sketch] .shotOpts label{font-size:16px}
.shotOpts label.chk{display:flex;align-items:center;gap:7px;color:var(--ink);height:40px}
.shotOpts input[type=checkbox]{width:18px;height:18px;accent-color:var(--pink)}
.shotOpts .sel{box-shadow:none}
.shotPrev{background:repeating-conic-gradient(rgba(127,127,127,.12) 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:8px;padding:12px;display:grid;place-items:center;max-height:58vh;overflow:auto;margin-bottom:12px}
.shotPrev img{max-width:100%;height:auto;display:block}
.hide{display:none!important}
input[type=file]{display:none}

@media (max-width:760px){
  body{overflow:auto;height:auto;min-height:100%}
  .brand small{display:none}
  .tools{width:100%}
  .tools .run{margin-left:auto}
  .lbl{display:none}
  .work,[data-ui=sketch] .work{display:flex;flex-direction:column;gap:var(--paneGap)}
  .gutter{display:none}
  #edPane{height:56vh}
  #outPane{height:44vh}
  .pop{right:auto;left:0}
  .status .hide-sm{display:none}
  .files{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .flist{border-right:0;border-bottom:1px solid var(--line);max-height:110px}
}

<body>
<header class="bar">

      </div>
    </details>
    <button class="btn" id="openBtn" type="button" title="Open a source file"><span class="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2" /></svg></span><span class="lbl">Open</span></button>
    <button class="btn" id="copyBtn" type="button" title="Copy code"><span class="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><rect width="14" height="14" x="8" y="8" rx="2" ry="2" /><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" /></svg></span><span class="lbl">Copy</span></button>

</header>

ss="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M10 8h.01" /><path d="M12 12h.01" /><path d="M14 8h.01" /><path d="M16 12h.01" /><path d="M18 8h.01" /><path d="M6 8h.01" /><path d="M7 16h10" /><path d="M8 12h.01" /><rect width="20" height="16" x="2" y="4" rx="2" /></svg></span></button><button class="btn mini" id="resetBtn" type="button" title="Restore the Hello World template"><span class="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></svg></span><span class="lbl">Reset</span></button></div>
    <div class="edbody">
      <div id="ed"></div>
      <div class="progs hide" id="progs" aria-label="My programs">
        <div class="prow"><input type="search" id="progSearch" placeholder="Search your programs" aria-label="Search programs" autocomplete="off" spellcheck="false"><button class="btn mini" id="progNew" type="button"><span class="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 12h14" /><path d="M12 5v14" /></svg></span>New</button></div>
        <div class="plist" id="plist"></div>
        <div class="prow pfoot"><span class="fnote" id="progUsage"></span><span class="sp"></span><button class="btn mini" id="progImport" type="button" title="Import .c/.cpp files or a backup"><span class="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 3v12" /><path d="m17 8-5-5-5 5" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /></svg></span><span class="lbl">Import</span></button><button class="btn mini" id="progExport" type="button" title="Back up all programs as one file"><span class="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 15V3" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /></svg></span><span class="lbl">Export all</span></button><input type="file" id="progFile" multiple accept=".c,.cpp,.cc,.cxx,.h,.hpp,.json,.txt"></div>
      </div>
    </div>
  </section>
  <div class="gutter" id="gutter" role="separator" aria-orientation="vertical" aria-label="Resize panes" tabindex="0"></div>
  <section class="pane" id="outPane">

      <button class="btn mini" id="filesBtn" type="button" aria-expanded="false" title="Files your programs can read and write"><span class="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M15 2h-4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8" /><path d="M16.706 2.706A2.4 2.4 0 0 0 15 2v5a1 1 0 0 0 1 1h5a2.4 2.4 0 0 0-.706-1.706z" /><path d="M5 7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 1.732-1" /></svg></span><span class="lbl">Files</span> <span id="fileCount">0</span></button>
      <button class="btn mini" id="eofBtn" type="button" title="Send end of input (Ctrl+D)" disabled><span class="ic" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 17V3" /><path d="m6 11 6 6 6-6" /><path d="M19 21H5" /></svg></span><span class="lbl">EOF</span></button>

// Duplicate the lines under each cursor. Inserting the copy above shifts the original down, which is
// exactly "copy line down"; for "copy line up" the selections are moved back onto the upper copy.
function duplicateLines(c, up) {
  c.operation(() => {
    const ranges = c.listSelections().map((r) => {
      const a = r.anchor, h = r.head;
      let from = Math.min(a.line, h.line), to = Math.max(a.line, h.line);
      const end = a.line > h.line ? a : h.line > a.line ? h : null;
      if (end && end.ch === 0 && to > from) to--;
      return { from, to, r };
    });
    const blocks = [...ranges].sort((x, y) => y.from - x.from);
    let lastFrom = Infinity;
    for (const b of blocks) {
      if (b.to >= lastFrom) continue; // overlapping selections: duplicate once
      lastFrom = b.from;
      c.replaceRange(c.getRange({ line: b.from, ch: 0 }, { line: b.to }) + '\n', { line: b.from, ch: 0 });
    }
    if (up) {
      const shifted = c.listSelections().map((r, i) => {
        const n = ranges[i] ? ranges[i].to - ranges[i].from + 1 : 0;
        return { anchor: { line: r.anchor.line - n, ch: r.anchor.ch }, head: { line: r.head.line - n, ch: r.head.ch } };
      });
      c.setSelections(shifted);
    }
  });
}

const compile = (req) => new Promise((res) => { const id = ++compileSeq; compileWaiters.set(id, res); compiler.postMessage({ type: 'compile', id, ...req }); });

/* ---------- run / interactive stdin by replay ---------- */
function setRunning(on) {
  running = on;
  const b = $('runBtn');
  b.classList.toggle('stop', on);
  $('runIc').innerHTML = icon(on ? 'square' : 'play');
  $('runLbl').textContent = on ? 'Stop' : 'Run';
  b.title = on ? 'Stop the program' : 'Run (Ctrl+Enter)';
  $('langC').disabled = $('langCpp').disabled = on;
  if (!on) { $('eofBtn').disabled = true; removeInput(); }
}
$('runIc').innerHTML = icon('play');
function runOrStop() { running || queued ? stop('Stopped by you.') : run(); }
$('runBtn').onclick = runOrStop;

function stop(reason) {
  if (queued) { queued = false; setRunning(false); meta('Cancelled.'); return; }
  killRunner();
  if (running) { meta(reason, 'bad'); setRunning(false); }
}
function killRunner() { clearTimeout(timer); timer = null; if (runner) { runner.terminate(); runner = null; } renderOut(true); }

async function run() {
  if (running) return;
  resetOutput(); clearMarks();
  if (engine.failed) { meta('The compiler failed to load. Reload the page to try again.', 'bad'); return; }
  setRunning(true);
  if (!engine.ready) {
    queued = true;
    append('Loading the compiler (first time only)\n', 'note');
    startCompiler();
    return;
  }

  const code = cm.getValue();
  const req = { code, lang, std: $('std').value, opt: $('opt').value, warnings: $('wall').checked };
  const key = JSON.stringify(req);
  let bytes = cache.key === key ? cache.bytes : null, compileMs = 0, diags = [];
  if (!bytes) {
    append('Compiling\n', 'note');
    const res = await compile(req);
    if (!running) return;
    resetOutput();
    compileMs = res.ms; diags = res.diagnostics;
    showDiagnostics(diags);
    if (!res.ok) { meta(`Compilation failed in ${compileMs} ms`, 'bad'); setRunning(false); $('stats').textContent = `compile ${compileMs} ms`; return; }
    bytes = res.bytes; cache = { key, bytes };
  }
  if (diags.length) append('\n');
  session = {
    bytes, compileMs, input: '', eof: false, shown: 0,
    args: $('argv').value.trim() ? $('argv').value.trim().split(/\s+/) : [],
    seed: Math.floor(Math.random() * 2 ** 31), startTimeNs: String(BigInt(Date.now()) * 1000000n),
    totalMs: 0, files: { ...vfs },
  };
  execute();
}

function execute() {
  killRunner();
  const s = session;
  let produced = 0;
  runner = makeWorker('run-worker.js');
  runner.onmessage = ({ data }) => {
    if (data.type === 'out') {
      for (const [fd, text] of data.chunks) {
        // On a replay, skip output the user has already seen.
        const skip = Math.max(0, Math.min(text.length, s.shown - produced));
        produced += text.length;
        const fresh = text.slice(skip);
        if (fresh) { queueOut(fresh, fd === 2 ? 'err' : null); s.shown = produced; }
      }
    } else if (data.type === 'done') {
      const r = data.result;
      s.totalMs += r.ms;
      clearTimeout(timer); timer = null; runner.terminate(); runner = null;
      drainOut(() => { if (r.status === 'input') askInput(); else finish(r); });
    }
  };
  runner.onerror = (e) => { e.preventDefault(); killRunner(); finish({ status: 'error', message: e.message || 'Runner crashed' }); };
  const limit = +$('limit').value * 1000;
  timer = setTimeout(() => stop(`Time limit exceeded (${limit / 1000} s). Is there an infinite loop? You can raise the limit in Options.`), limit);
  runner.postMessage({ type: 'run', bytes: s.bytes, args: s.args, stdin: s.input, eofMode: s.eof, seed: s.seed, startTimeNs: s.startTimeNs, files: s.files, skipChars: s.shown });
}

// Program output is queued and drawn at most once per animation frame, so a program printing
// thousands of lines never makes the page do thousands of layouts.
let outQueue = [], outFrame = 0;
function queueOut(text, cls) {
  const last = outQueue[outQueue.length - 1];
  if (last && last[1] === cls) last[0] += text; else outQueue.push([text, cls]);
  if (!outFrame) outFrame = requestAnimationFrame(renderOut);
}
const FRAME_BUDGET = 65536; // characters drawn per frame; the rest waits for the next frame
function renderOut(all) {
  if (outFrame) { cancelAnimationFrame(outFrame); outFrame = 0; }
  let budget = all === true ? Infinity : FRAME_BUDGET;
  while (outQueue.length && budget > 0) {
    const item = outQueue[0];
    if (item[0].length <= budget) { outQueue.shift(); emit(item[0], item[1]); budget -= item[0].length; }
    else {
      let cut = item[0].lastIndexOf('\n', budget); cut = cut > 0 ? cut + 1 : budget;
      emit(item[0].slice(0, cut), item[1]); item[0] = item[0].slice(cut); budget = 0;
    }
  }
  stick();
  if (outQueue.length) outFrame = requestAnimationFrame(renderOut);
}
// Finish drawing queued output before showing the exit line or an input prompt.
function drainOut(then) {
  if (!outQueue.length) { renderOut(true); then(); return; }
  renderOut();
  requestAnimationFrame(() => drainOut(then));
}
// Handles the clear-screen sequence and drops other terminal escape codes.
function emit(text, cls) {
  text.split(/\x1b\[2J/).forEach((part, i) => {
    if (i > 0) resetOutput();
    append(part.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, ''), cls);
  });
}

function finish(r) {
  const s = session;
  let filesChanged = false;
  if (r.files) {
    const sig = (o) => JSON.stringify(Object.keys(o).sort().map((k) => [k, o[k].length]));
    filesChanged = sig(vfs) !== sig(r.files);
    vfs = r.files; saveFiles();
    if (!vfs[curFile]) curFile = Object.keys(vfs)[0] || '';
    renderFiles();
  }
  if (outNode && !outNode.data.endsWith('\n')) append('\n');
  const t = `compile ${s.compileMs ? s.compileMs + ' ms' : 'cached'}, run ${s.totalMs} ms`;
  if (r.status === 'exit') meta(`Process exited with code ${r.code} (${t})`, r.code === 0 ? 'good' : 'bad');
  else meta(`${r.message} (${t})`, 'bad');
  if (filesChanged) meta('Files changed. Open Files to see them.');
  $('stats').textContent = t;
  setRunning(false);
}

function askInput() {
  removeInput();
  const wrap = document.createElement('span');
  wrap.id = 'inwrap';
  const inp = document.createElement('input');
  inp.id = 'stdin'; inp.autocomplete = 'off'; inp.spellcheck = false; inp.setAttribute('aria-label', 'Program input');
  wrap.appendChild(inp);
  const hint = document.createElement('div');
  hint.className = 'waiting'; hint.id = 'waitHint';
  hint.innerHTML = '<i class="dot"></i>Waiting for input. Type and press Enter, or Ctrl+D to end input.';
  const host = term.lastChild && term.lastChild.classList && term.lastChild.classList.contains('ob') ? term.lastChild : term;
  host.appendChild(wrap); term.appendChild(hint); outNode = null; stick();
  $('eofBtn').disabled = false;
  inp.focus({ preventScroll: true });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); submit([inp.value]); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); if (inp.value) submit([inp.value]); sendEOF(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && !inp.selectionEnd) { e.preventDefault(); stop('Interrupted (Ctrl+C).'); }
  });
  inp.addEventListener('paste', (e) => {
    const text = e.clipboardData?.getData('text') || '';
    if (!text.includes('\n')) return;
    e.preventDefault();
    const lines = (inp.value + text).replace(/\r/g, '').split('\n');
    const rest = lines.pop();
    submit(lines, rest);
  });
}
function removeInput() { $('inwrap')?.remove(); $('waitHint')?.remove(); }
function submit(lines, rest = '') {
  removeInput();
  for (const l of lines) { append(l, 'in'); append('\n'); }
  session.input += lines.map((l) => l + '\n').join('');
  $('eofBtn').disabled = true;
  execute();
  if (rest) setTimeout(() => { const i = $('stdin'); if (i) i.value = rest; }, 0);
}
function sendEOF() { if (!running || !session) return; removeInput(); append('^D', 'note'); append('\n'); session.eof = true; $('eofBtn').disabled = true; execute(); }
$('eofBtn').onclick = sendEOF;

function showDiagnostics(lines) {
  const re = /^main\.(?:c|cpp):(\d+):(\d+):\s+(fatal error|error|warning|note):\s*(.*)$/;
  for (const line of lines) {
    const m = line.match(re);
    if (m) {
      const kind = m[3].includes('error') ? 'error' : m[3];
      const s = document.createElement('span');
      s.className = 'diag ' + (kind === 'error' ? 'err' : kind === 'warning' ? 'warn' : 'note');
      s.textContent = line; s.title = 'Click to jump to line ' + m[1];
      const ln = +m[1] - 1, ch = +m[2] - 1;
      s.onclick = () => { cm.focus(); cm.setCursor({ line: ln, ch }); cm.scrollIntoView({ line: ln, ch }, 80); };
      term.appendChild(s); outNode = null;
      if (kind !== 'note') markLine(ln, kind, m[4]);
    } else {
      append(line + '\n', /error/.test(line) ? 'err' : 'note');
    }
  }
}

addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !cm.hasFocus()) { e.preventDefault(); runOrStop(); } });
}
</script>
</body>
